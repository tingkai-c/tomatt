name: Build signed macOS app

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: signed-macos-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: TomatoBar
  PROJECT_PATH: TomatoBar.xcodeproj
  SCHEME: TomatoBar
  CONFIGURATION: Release

jobs:
  build:
    name: Build, sign, and notarize
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set build metadata
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(git describe --tags --match 'v*' --always --dirty 2>/dev/null || git rev-parse --short HEAD)"
            version="${version#v}"
          fi

          artifact_version="$(printf '%s' "$version" | sed -E 's#[/[:space:]]+#-#g; s/[^[:alnum:]._-]//g; s/^-+|-+$//g')"
          if [[ -z "$artifact_version" ]]; then
            artifact_version="$(git rev-parse --short HEAD)"
          fi
          marketing_version="$(printf '%s' "$version" | sed -E 's/[^0-9.].*$//')"
          if [[ ! "$marketing_version" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            marketing_version="0.0.0"
          fi

          echo "ARTIFACT_VERSION=${artifact_version}" >> "$GITHUB_ENV"
          echo "MARKETING_VERSION=${marketing_version}" >> "$GITHUB_ENV"

      - name: Import Developer ID certificate
        shell: bash
        env:
          MACOS_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          : "${MACOS_DEVELOPER_ID_CERTIFICATE_BASE64:?Missing MACOS_DEVELOPER_ID_CERTIFICATE_BASE64 secret}"
          : "${MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD:?Missing MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD secret}"
          : "${MACOS_KEYCHAIN_PASSWORD:?Missing MACOS_KEYCHAIN_PASSWORD secret}"

          certificate_path="$RUNNER_TEMP/developer-id-application.p12"
          keychain_path="$RUNNER_TEMP/app-signing.keychain-db"

          printf '%s' "$MACOS_DEVELOPER_ID_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"

          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" \
            -P "$MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$MACOS_KEYCHAIN_PASSWORD" \
            "$keychain_path"

          existing_keychains="$(security list-keychains -d user | sed 's/[" ]//g')"
          # shellcheck disable=SC2086 # Keychain paths from `security` do not contain spaces on GitHub-hosted macOS runners.
          security list-keychains -d user -s "$keychain_path" $existing_keychains
          security find-identity -v -p codesigning "$keychain_path"

          echo "SIGNING_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
          rm -f "$certificate_path"

      - name: Build signed app
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          : "${APPLE_TEAM_ID:?Missing APPLE_TEAM_ID secret}"
          : "${SIGNING_KEYCHAIN_PATH:?Signing keychain was not configured}"

          derived_data_path="$RUNNER_TEMP/DerivedData"

          xcodebuild clean build \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -derivedDataPath "$derived_data_path" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            OTHER_CODE_SIGN_FLAGS="--timestamp --options runtime --keychain $SIGNING_KEYCHAIN_PATH" \
            ONLY_ACTIVE_ARCH=NO

          app_path="$derived_data_path/Build/Products/$CONFIGURATION/$APP_NAME.app"
          if [[ ! -d "$app_path" ]]; then
            echo "Expected app bundle was not built: $app_path" >&2
            find "$derived_data_path/Build/Products" -maxdepth 3 -name '*.app' -print >&2 || true
            exit 1
          fi

          echo "APP_PATH=$app_path" >> "$GITHUB_ENV"

      - name: Notarize and staple app
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail

          : "${APP_PATH:?App bundle path was not configured}"
          : "${APP_STORE_CONNECT_KEY_ID:?Missing APP_STORE_CONNECT_KEY_ID secret}"
          : "${APP_STORE_CONNECT_ISSUER_ID:?Missing APP_STORE_CONNECT_ISSUER_ID secret}"
          : "${APP_STORE_CONNECT_API_KEY_BASE64:?Missing APP_STORE_CONNECT_API_KEY_BASE64 secret}"

          api_key_path="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          notary_zip="$RUNNER_TEMP/$APP_NAME-notary.zip"
          notary_result_path="$RUNNER_TEMP/notary-result.json"

          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$api_key_path"
          chmod 600 "$api_key_path"

          ditto -c -k --keepParent "$APP_PATH" "$notary_zip"
          xcrun notarytool submit "$notary_zip" \
            --key "$api_key_path" \
            --key-id "$APP_STORE_CONNECT_KEY_ID" \
            --issuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --wait \
            --output-format json > "$notary_result_path"

          notary_status="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["status"])' "$notary_result_path")"
          if [[ "$notary_status" != "Accepted" ]]; then
            submission_id="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1])).get("id", ""))' "$notary_result_path")"
            echo "Notarization failed with status: $notary_status" >&2
            if [[ -n "$submission_id" ]]; then
              xcrun notarytool log "$submission_id" \
                --key "$api_key_path" \
                --key-id "$APP_STORE_CONNECT_KEY_ID" \
                --issuer "$APP_STORE_CONNECT_ISSUER_ID"
            fi
            exit 1
          fi

          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          rm -f "$api_key_path" "$notary_zip" "$notary_result_path"

      - name: Validate signed app
        shell: bash
        run: |
          set -euo pipefail

          : "${APP_PATH:?App bundle path was not configured}"

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -dv --verbose=4 "$APP_PATH"
          spctl -a -vvv -t execute "$APP_PATH"
          xcrun stapler validate "$APP_PATH"

      - name: Package app
        shell: bash
        run: |
          set -euo pipefail

          : "${APP_PATH:?App bundle path was not configured}"
          artifact_path="$PWD/$APP_NAME-$ARTIFACT_VERSION.zip"

          ditto -c -k --keepParent "$APP_PATH" "$artifact_path"
          echo "ARTIFACT_PATH=$artifact_path" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=$APP_NAME-$ARTIFACT_VERSION" >> "$GITHUB_ENV"

      - name: Upload signed app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_PATH }}
          if-no-files-found: error

      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARTIFACT_PATH }}

      - name: Delete old prerelease
        if: github.ref_type == 'branch'
        continue-on-error: true
        uses: dev-drprasad/delete-tag-and-release@v1.1
        with:
          delete_release: true
          tag_name: prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prerelease
        if: github.ref_type == 'branch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prerelease
          prerelease: true
          files: ${{ env.ARTIFACT_PATH }}

      - name: Clean up signing materials
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${SIGNING_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$SIGNING_KEYCHAIN_PATH" || true
          fi
          rm -f "$RUNNER_TEMP"/developer-id-application.p12
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8
          rm -f "$RUNNER_TEMP"/*-notary.zip
          rm -f "$RUNNER_TEMP"/notary-result.json
